<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scout Database - Pro Edition</title>
<style>
  body{font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f4f6f8; padding:20px; color: #333;}
  .container{max-width:1200px; margin:auto; background:#fff; padding:25px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08)}
  
  /* Inputs & Buttons */
  input, select, button { padding:12px; width:100%; margin-bottom:12px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box; font-size: 14px; }
  button { background:#2563eb; color:#fff; border:none; cursor:pointer; font-weight:600; transition: 0.3s; }
  button:hover { background:#1d4ed8; }
  .btn-danger { background:#ef4444; }
  .btn-danger:hover { background:#dc2626; }
  .btn-secondary { background:#64748b; }

  /* Layout */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 30px; }
  .box { background:#f8fafc; padding:20px; border-radius:10px; border:1px solid #e2e8f0; }
  .hidden { display:none; }

  /* Tabs */
  .tab-group { display: flex; gap: 10px; margin-bottom: 10px; }
  .tab-btn { flex: 1; background: #e2e8f0; color: #475569; padding: 10px; cursor: pointer; border-radius: 6px; text-align: center; font-size: 13px; font-weight: bold; }
  .tab-btn.active { background: #8b5cf6; color: white; }

  /* Table & Badges */
  table { width:100%; border-collapse:collapse; margin-top:20px; background: white; }
  th, td { border:1px solid #edf2f7; padding:15px; text-align:left; }
  th { background:#f1f5f9; font-weight: 600; }
  
  .badge-tag { padding:5px 10px; border-radius:6px; font-size:12px; display:inline-block; margin:3px; position: relative; border: 1px solid transparent; }
  .type-badge { background:#ebf5ff; color:#1e40af; border-color: #bfdbfe; }
  .type-award { background:#fef3c7; color:#92400e; border-color: #fde68a; font-weight: bold; }
  .date-sub { display: block; font-size: 10px; opacity: 0.8; margin-top: 2px; border-top: 1px solid rgba(0,0,0,0.1); }
  
  .admin-edit-hint { cursor: pointer; border: 1px dashed #2563eb; }
  .admin-edit-hint:hover { transform: scale(1.05); }

  /* Modals */
  .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:1000; }
  .modal-content { background:white; padding:30px; border-radius:12px; width:400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }

  @media print {
    .no-print { display: none !important; }
    body { background: white; padding: 0; }
    .container { box-shadow: none; border: none; width: 100%; }
  }
</style>
</head>
<body>

<div id="loginPage" class="container" style="max-width: 400px; margin-top: 100px;">
  <h2 style="text-align:center">Scout Database Login</h2>
  <input id="user" placeholder="Username (admin / entry)">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="handleLogin()">Login</button>
</div>

<div id="mainDashboard" class="container hidden">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
    <h2>Scout Management Dashboard</h2>
    <button onclick="location.reload()" class="btn-danger" style="width: auto;">Logout</button>
  </div>

  <div class="grid no-print">
    <div class="box">
      <h3>1. Register New Scout</h3>
      <input id="reg_id" placeholder="Registration No">
      <input id="reg_name" placeholder="Full Name">
      <select id="reg_section">
        <option value="">-- Select Section --</option>
        <option>Sigithi Scout</option><option>Cub Scout</option>
        <option>Scout</option><option>Rover Scout</option>
      </select>
      <input id="reg_troop" placeholder="Troop Name">
      <input id="reg_dob" type="date">
      <button onclick="registerScout()">+ Save Profile</button>
    </div>

    <div class="box">
      <h3>2. Award Badge / Award</h3>
      <input id="award_reg" placeholder="Enter Scout Reg No">
      
      <div class="tab-group">
        <div id="tabB" class="tab-btn active" onclick="setAwardType('badge')">Proficiency Badges</div>
        <div id="tabA" class="tab-btn" onclick="setAwardType('award')">Core Awards</div>
      </div>

      <select id="award_name_badge">
          <option value="">-- Select Badge Code --</option>
          <optgroup label="Junior">
              <option>J.A./01</option><option>J.A./02</option><option>J.A./03</option><option>J.A./04</option>
          </optgroup>
          <optgroup label="Senior">
              <option>S.A./01</option><option>S.A./02</option><option>S.A./03</option><option>S.A./04</option>
          </optgroup>
      </select>
      
      <select id="award_name_core" class="hidden">
          <option value="">-- Select Core Award --</option>
          <option>Membership Badge</option><option>Bronze Award</option>
          <option>Silver Award</option><option>Gold Award</option>
          <option>President Award</option>
      </select>

      <input type="date" id="award_date">
      <button onclick="addAwardToScout()" style="background:#8b5cf6">🎖️ Update Record</button>
    </div>
  </div>

  <hr class="no-print">
  
  <div class="no-print" style="margin-top: 20px;">
    <input id="searchBar" placeholder="🔍 Search by Name or Reg No..." onkeyup="renderTable()">
  </div>

  <table id="scoutTable">
    <thead>
      <tr>
        <th>Reg No</th>
        <th>Basic Info</th>
        <th>Badges & Awards (Click to Edit)</th>
        <th class="no-print">Print</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div id="editModal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3 id="editTitle">Edit Record</h3>
    <label>Name/Code:</label>
    <input id="edit_val_name">
    <label>Date Earned:</label>
    <input type="date" id="edit_val_date">
    <button onclick="saveBadgeChange()">Save Changes</button>
    <button onclick="deleteBadgeRecord()" class="btn-danger">Delete This Badge</button>
    <button onclick="closeModal()" class="btn-secondary">Cancel</button>
  </div>
</div>

<script>
let scouts = JSON.parse(localStorage.getItem("scout_db") || "[]");
let currentUser = null;
let currentAwardTab = 'badge';
let activeEdit = { reg: null, index: null };

function handleLogin() {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;
    if((u === "admin" && p === "admin123") || (u === "entry" && p === "entry123")) {
        currentUser = u;
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("mainDashboard").classList.remove("hidden");
        renderTable();
    } else { alert("Login failed"); }
}

function setAwardType(type) {
    currentAwardTab = type;
    document.getElementById("tabB").className = type === 'badge' ? "tab-btn active" : "tab-btn";
    document.getElementById("tabA").className = type === 'award' ? "tab-btn active" : "tab-btn";
    document.getElementById("award_name_badge").classList.toggle("hidden", type !== 'badge');
    document.getElementById("award_name_core").classList.toggle("hidden", type !== 'award');
}

function registerScout() {
    const reg = document.getElementById("reg_id").value;
    if(!reg || scouts.some(s => s.reg === reg)) {
        alert("Registration Number missing or already exists!");
        return;
    }
    scouts.push({
        reg,
        name: document.getElementById("reg_name").value,
        section: document.getElementById("reg_section").value,
        troop: document.getElementById("reg_troop").value,
        dob: document.getElementById("reg_dob").value,
        awards: []
    });
    sync();
}

function addAwardToScout() {
    const r = document.getElementById("award_reg").value;
    const s = scouts.find(x => x.reg === r);
    const name = currentAwardTab === 'badge' ? document.getElementById("award_name_badge").value : document.getElementById("award_name_core").value;
    const date = document.getElementById("award_date").value;

    if(!s || !name || !date) return alert("Fill all info correctly");
    
    s.awards.push({ name, date, type: currentAwardTab });
    sync();
}

function renderTable() {
    const body = document.getElementById("tableBody");
    const query = document.getElementById("searchBar").value.toLowerCase();
    body.innerHTML = "";

    scouts.filter(s => s.name.toLowerCase().includes(query) || s.reg.includes(query)).forEach(s => {
        let awardsHTML = s.awards.map((a, idx) => `
            <div class="badge-tag type-${a.type} ${currentUser === 'admin' ? 'admin-edit-hint' : ''}" 
                 onclick="${currentUser === 'admin' ? `openEdit('${s.reg}', ${idx})` : ''}">
                ${a.name}
                <span class="date-sub">${a.date}</span>
            </div>
        `).join("");

        body.innerHTML += `
            <tr>
                <td><strong>${s.reg}</strong></td>
                <td>
                    <strong>${s.name}</strong><br>
                    <small>DOB: ${s.dob} | ${s.section}</small>
                </td>
                <td>${awardsHTML || '<em>No records</em>'}</td>
                <td class="no-print"><button onclick="window.print()" style="width:auto; padding:5px 10px">🖨️</button></td>
            </tr>
        `;
    });
}

function openEdit(reg, index) {
    activeEdit = { reg, index };
    const s = scouts.find(x => x.reg === reg);
    const a = s.awards[index];
    document.getElementById("edit_val_name").value = a.name;
    document.getElementById("edit_val_date").value = a.date;
    document.getElementById("editModal").classList.remove("hidden");
}

function saveBadgeChange() {
    const s = scouts.find(x => x.reg === activeEdit.reg);
    s.awards[activeEdit.index].name = document.getElementById("edit_val_name").value;
    s.awards[activeEdit.index].date = document.getElementById("edit_val_date").value;
    sync();
    closeModal();
}

function deleteBadgeRecord() {
    if(confirm("Permanently delete this badge record?")) {
        const s = scouts.find(x => x.reg === activeEdit.reg);
        s.awards.splice(activeEdit.index, 1);
        sync();
        closeModal();
    }
}

function sync() {
    localStorage.setItem("scout_db", JSON.stringify(scouts));
    renderTable();
}

function closeModal() { document.getElementById("editModal").classList.add("hidden"); }
</script>
</body>
</html>
