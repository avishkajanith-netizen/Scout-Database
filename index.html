<script>
/* ===== USERS ===== */
const users = {
  admin: { password: "admin123", role: "admin" },
  entry: { password: "entry123", role: "entry" }
};

let currentUser = null;
let scouts = JSON.parse(localStorage.getItem("scouts") || "[]");

/* ===== LOGIN ===== */
function login() {
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  if (users[u] && users[u].password === p) {
    currentUser = users[u];
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("roleText").innerText = currentUser.role;
    render();
  } else {
    alert("Invalid login");
  }
}

/* ===== LOGOUT ===== */
function logout() {
  currentUser = null;
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("dashboard").classList.add("hidden");
}

/* ===== SAVE ===== */
function save() {
  localStorage.setItem("scouts", JSON.stringify(scouts));
}

/* ===== ADD SCOUT ===== */
function addScout() {
  const reg = document.getElementById("s_reg").value;
  if (!reg) return alert("Enter Registration No");
  if (scouts.find(s => s.reg === reg)) {
    alert("Scout already exists");
    return;
  }

  scouts.push({
    reg: reg,
    name: document.getElementById("s_name").value,
    dob: document.getElementById("s_dob").value,
    troop: document.getElementById("s_troop").value,
    badges: []
  });

  save();
  render();
}

/* ===== ADD BADGE ===== */
function addBadge() {
  const reg = document.getElementById("b_reg").value;
  const scout = scouts.find(s => s.reg === reg);
  if (!scout) {
    alert("Scout not found");
    return;
  }

  scout.badges.push({
    name: document.getElementById("b_name").value,
    date: document.getElementById("b_date").value
  });

  save();
  render();
}

/* ===== EDIT SCOUT ===== */
function editScout(reg) {
  if(currentUser.role !== "admin") return;
  const s = scouts.find(x => x.reg === reg);
  if (!s) return;

  s.name  = prompt("Scout Name:", s.name) || s.name;
  s.troop = prompt("Troop:", s.troop) || s.troop;
  s.dob   = prompt("DOB (YYYY-MM-DD):", s.dob) || s.dob;

  save();
  render();
}

/* ===== EDIT BADGE ===== */
function editBadge(reg, index) {
  if(currentUser.role !== "admin") return;
  const s = scouts.find(x => x.reg === reg);
  if (!s) return;

  const badge = s.badges[index];
  const newName = prompt("Badge Name:", badge.name);
  const newDate = prompt("Badge Date (YYYY-MM-DD):", badge.date);

  if (newName) badge.name = newName;
  if (newDate) badge.date = newDate;

  save();
  render();
}

/* ===== DELETE BADGE ===== */
function deleteBadge(reg, index) {
  if(currentUser.role !== "admin") return;
  const s = scouts.find(x => x.reg === reg);
  if (!s) return;

  if (confirm("Remove this badge?")) {
    s.badges.splice(index, 1);
    save();
    render();
  }
}

/* ===== DELETE SCOUT ===== */
function deleteScout(reg) {
  if(currentUser.role !== "admin") return;
  if (confirm("Delete this scout completely?")) {
    scouts = scouts.filter(s => s.reg !== reg);
    save();
    render();
  }
}

/* ===== RENDER TABLE ===== */
function render() {
  const table = document.getElementById("table");
  table.innerHTML = "";
  const q = document.getElementById("search").value || "";

  scouts
    .filter(s => s.reg.includes(q))
    .forEach(s => {

      let badgeHTML = s.badges.map((b, i) =>
        currentUser.role === "admin"
          ? `${b.name} (${b.date}) <button onclick="editBadge('${s.reg}',${i})">✏️</button> <button onclick="deleteBadge('${s.reg}',${i})">❌</button>`
          : `${b.name} (${b.date})`
      ).join("<br>");

      table.innerHTML += `
      <tr>
        <td>${s.reg}</td>
        <td>${s.name}</td>
        <td>${s.dob}</td>
        <td>${s.troop}</td>
        <td>${badgeHTML}</td>
        <td class="admin-only">
          ${currentUser.role === "admin"
            ? `<button onclick="editScout('${s.reg}')">Edit Scout</button>
               <button onclick="deleteScout('${s.reg}')">Delete Scout</button>`
            : ""}
        </td>
      </tr>`;
    });
}
</script>
